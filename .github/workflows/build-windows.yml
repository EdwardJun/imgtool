name: build

# Windows（NSIS + MSI）和 macOS（Apple Silicon + Intel 的 DMG）安装包。
# 手动触发，或推送 v* 标签时自动打包。
# 文件名保留 build-windows.yml：手动触发要求默认分支上已有同名文件
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # AVIF 编码器（rav1e）在 x86_64 上必须用 nasm 编译汇编，缺少会直接编译失败
      - uses: ilammy/setup-nasm@v1

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # 会先编译 imgtool sidecar（release），再打 NSIS (.exe) 和 MSI 安装包
      - name: Build installer
        working-directory: apps/desktop
        run: pnpm build

      # 模拟用户场景：装好后 Agent 正在运行 MCP 服务（imgtool.exe 被占用），再覆盖安装
      - name: Verify upgrade while MCP server is running
        shell: pwsh
        run: |
          $setup = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'ImgToolTest'
          $exe = Join-Path $dir 'imgtool.exe'
          $first = Start-Process $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($first.ExitCode -ne 0 -or -not (Test-Path $exe)) { throw "首次安装失败（退出码 $($first.ExitCode)）" }

          $psi = New-Object System.Diagnostics.ProcessStartInfo $exe, 'mcp'
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $mcp = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep -Seconds 2
          if ($mcp.HasExited) { throw 'MCP 服务未能保持运行' }

          $second = Start-Process $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          Get-ChildItem $dir | Format-Table Name, Length
          if ($second.ExitCode -ne 0) { throw "MCP 运行中覆盖安装失败（退出码 $($second.ExitCode)）" }
          if (-not (Test-Path $exe)) { throw '覆盖安装后缺少 imgtool.exe' }
          if (-not (Get-ChildItem (Join-Path $dir 'imgtool.exe.old*'))) { throw '未走到"文件被占用"的分支，测试无效' }
          if ($mcp.HasExited) { throw '安装过程中 MCP 服务被中断' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw '新的 imgtool.exe 无法运行' }
          $mcp.Kill()

      - uses: actions/upload-artifact@v4
        with:
          name: imgtool-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos:
    # Apple Silicon 运行器；Intel 版交叉编译
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            lipo: arm64
          - target: x86_64-apple-darwin
            arch: x64
            lipo: x86_64
    name: macos-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rav1e 编译 x86_64 汇编需要 nasm
      - name: Install nasm
        if: matrix.arch == 'x64'
        run: brew install nasm

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # beforeBuildCommand 会按 TAURI_ENV_TARGET_TRIPLE 编译对应架构的 imgtool sidecar。
      # 没有 Apple 开发者证书：用 ad-hoc 签名（"-"），否则下载后会被提示"已损坏"
      - name: Build DMG
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Verify DMG
        run: |
          set -euo pipefail
          dmg=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -force >/dev/null || true' EXIT
          app="$mnt/ImgTool.app"
          ls -la "$app/Contents/MacOS"
          for bin in imgtool-desktop imgtool; do
            test -x "$app/Contents/MacOS/$bin" || { echo "缺少 $bin"; exit 1; }
            archs=$(lipo -archs "$app/Contents/MacOS/$bin")
            [ "$archs" = "${{ matrix.lipo }}" ] || { echo "$bin 架构是 $archs，期望 ${{ matrix.lipo }}"; exit 1; }
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          # Intel 版需要 Rosetta 才能在 Apple Silicon 运行器上执行
          if [ "${{ matrix.arch }}" = aarch64 ] || arch -x86_64 /usr/bin/true 2>/dev/null; then
            "$app/Contents/MacOS/imgtool" --version
          else
            echo "::warning::运行器没有 Rosetta，跳过 Intel 版 imgtool 运行检查"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: imgtool-macos-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
